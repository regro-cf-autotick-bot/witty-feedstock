{% set name = "witty" %}
{% set version = "0.3.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/witty-{{ version }}.tar.gz
  sha256: e0a3b1a84fc4429d8b8ab6031c9d2c171b30ef2e64d80dbe89a02b12e3442fa3

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >={{ python_min }}
    - cython >=3.0,<3.2
    - setuptools
    - nanobind >=0.2.8
    - cxx-compiler

test:
  imports:
    - witty
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/funkelab/witty
  summary: Well-in-Time Compiler for Cython Modules
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - tlambert03
    - funkey
